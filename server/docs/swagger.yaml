definitions:
  request.CreateCategoryRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  request.CreateProductRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      image:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      price:
        minimum: 0
        type: number
      stock:
        minimum: 0
        type: integer
    required:
    - name
    - price
    - stock
    type: object
  request.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - password
    - phone
    type: object
  request.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  request.ProcessOrderRequest:
    properties:
      quantity:
        minimum: 1
        type: integer
    required:
    - quantity
    type: object
  request.ResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  request.RestockRequest:
    properties:
      quantity:
        minimum: 1
        type: integer
    required:
    - quantity
    type: object
  request.SetNewPasswordRequest:
    properties:
      password:
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  request.UpdateCategoryRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  request.UpdateProductRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      image:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      price:
        minimum: 0
        type: number
      stock:
        minimum: 0
        type: integer
    required:
    - name
    - price
    - stock
    type: object
  request.UpdateStockRequest:
    properties:
      stock:
        minimum: 0
        type: integer
    required:
    - stock
    type: object
  request.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - phone
    type: object
  response.OrderProcessResponse:
    properties:
      order_processed:
        type: boolean
      order_quantity:
        type: integer
      processed_at:
        type: string
      product_id:
        type: string
      product_name:
        type: string
      remaining_stock:
        type: integer
    type: object
  response.ProductListResponse:
    properties:
      has_next:
        type: boolean
      has_previous:
        type: boolean
      limit:
        type: integer
      page:
        type: integer
      products:
        items:
          $ref: '#/definitions/response.ProductResponse'
        type: array
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  response.ProductResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      image:
        type: string
      in_stock:
        type: boolean
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  response.ProductSearchResponse:
    properties:
      products:
        items:
          $ref: '#/definitions/response.ProductResponse'
        type: array
      query:
        type: string
      result_count:
        type: integer
    type: object
  response.ProductStockResponse:
    properties:
      current_stock:
        type: integer
      id:
        type: string
      name:
        type: string
      previous_stock:
        type: integer
      stock_change:
        type: integer
      updated_at:
        type: string
    type: object
  response.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  utils.Response:
    type: object
info:
  contact: {}
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return token
      parameters:
      - description: User login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login success
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User registration success
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/utils.Response'
        "409":
          description: Email already in use
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Set a new password using a reset token
      parameters:
      - description: Token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.SetNewPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password has been reset successfully
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Invalid request or token
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Reset user password
      tags:
      - auth
  /auth/reset-password/check-token:
    get:
      consumes:
      - application/json
      description: Check if a password reset token is valid
      parameters:
      - description: Reset token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Token valid
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Token not provided
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Token not found
          schema:
            $ref: '#/definitions/utils.Response'
        "410":
          description: Token expired
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Check reset password token validity
      tags:
      - auth
  /auth/reset-password/request:
    post:
      consumes:
      - application/json
      description: Send a password reset link to the user's email
      parameters:
      - description: Email to send reset link to
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset instructions sent to your email
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Request password reset
      tags:
      - auth
  /categories:
    get:
      description: Retrieve a list of all categories
      produces:
